# PostgreSQL Database Configuration (Supabase)
# URL format: jdbc:postgresql://user:password@host:port/database
spring.datasource.url=${SUPABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# Initialisation des données SQL
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data-etablissements.sql
spring.sql.init.continue-on-error=true

# Désactiver les repositories Redis automatiques
spring.data.redis.repositories.enabled=false

# Redis Configuration (Docker)
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=60000

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Mail Configuration || (MailHog)
spring.mail.host=${MAIL_HOST:mailhog}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USER}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_HOST:mailhog}

# JWT Configuration
jwt.secret-key=${JWT_SECRET_KEY}
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000
jwt.access-token.cookie-name=access_token
jwt.refresh-token.cookie-name=refresh_token

# OAuth2 Configuration
app.oauth2.redirect-uri=${FRONTEND_URL:http://localhost:5173}/auth/callback

# OAuth2 Google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid, email, profile

# CORS Configuration
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173}


# Logging
logging.level.org.springframework=INFO
logging.level.com.cameroun_tour=DEBUG
logging.level.org.hibernate.SQL=WARN

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
