# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

permissions:
  contents: write
  security-events: write
  id-token: write
  
on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]


jobs:
  build:

    runs-on: ubuntu-latest
    
    services:
        mysql:
          image: mysql
          ports:
            - 3306:3306
          env:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: cameroun_tour
            MYSQL_USER: ${{ secrets.DB_USER_MYSQL }}
            MYSQL_PASSWORD: ${{ secrets.DB_PASSWORD_MYSQL }}
          options: --health-cmd="mysqladmin ping --silent" --health-interval=10s --health-timeout=5s --health-retries=10

        # keycloak:
        #   image: quay.io/keycloak/keycloak:21.1.1
        #   ports:
        #     - 8000:8080
        #   options: >-
        #       --health-cmd="curl -f http://localhost:8080/realms/master || exit 1"
        #       --health-interval=10s
        #       --health-timeout=5s
        #       --health-retries=5
        #       start-dev
        #   env:
        #     KEYCLOAK_ADMIN: admin
        #     KEYCLOAK_ADMIN_PASSWORD: admin

        mailhog:
          image: mailhog/mailhog
          ports:
            - 8025:8025
            - 1025:1025

    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Start Keycloak (dev) with docker
        env:
          KEYCLOAK_ADMIN: admin
          # Optionnel: utilisez un secret GitHub au lieu de mettre en clair
          # KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
          KEYCLOAK_ADMIN_PASSWORD: adminpassword
        run: |


            # Remove any previous container (if present)
            docker rm -f keycloak || true

            # Start Keycloak in development mode (start-dev)
            docker run -d --name keycloak \
              -e KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN} \
              -e KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD} \
              -p 8000:8080 \
              quay.io/keycloak/keycloak:21.1.1 start-dev

            # Wait for Keycloak to be ready (timeout ~2 minutes)
            echo "Waiting for Keycloak to be ready on http://localhost:8000/realms/master ..."
            for i in $(seq 1 60); do
              if curl -fsS http://localhost:8000/realms/master >/dev/null 2>&1; then
                echo "Keycloak is ready"
                break
              fi
              echo "Keycloak not ready yet (attempt $i/60). Sleeping 2s..."
              sleep 2
            done

            # Fail if Keycloak never became ready
            if ! curl -fsS http://localhost:8000/realms/master >/dev/null 2>&1; then
              echo "Keycloak did not become ready in time"
              docker logs keycloak || true
              exit 1
            fi
      - name: Build with Maven
        working-directory: server
        run: mvn -B package --file  pom.xml

      # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
      - name: Update dependency graph
        uses: advanced-security/maven-dependency-submission-action@v4
