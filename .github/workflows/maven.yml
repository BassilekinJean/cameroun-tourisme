# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

permissions:
  contents: write
  security-events: write
  id-token: write
  
on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]


jobs:
  build:

    runs-on: ubuntu-latest
    
    services:
        mysql:
          image: mysql
          ports:
            - 3306:3306
          env:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: cameroun_tour
            MYSQL_USER: ${{ secrets.DB_USER_MYSQL }}
            MYSQL_PASSWORD: ${{ secrets.DB_PASSWORD_MYSQL }}
          options: --health-cmd="mysqladmin ping --silent" --health-interval=10s --health-timeout=5s --health-retries=10

        mailhog:
          image: mailhog/mailhog
          ports:
            - 8025:8025
            - 1025:1025

    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        working-directory: server
        env:
          DB_USER_MYSQL: ${{ secrets.DB_USER_MYSQL || 'testuser' }}
          DB_PASSWORD_MYSQL: ${{ secrets.DB_PASSWORD_MYSQL || 'testpassword' }}
        run: mvn -B package --file  pom.xml

      # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
      - name: Update dependency graph
        uses: advanced-security/maven-dependency-submission-action@v4