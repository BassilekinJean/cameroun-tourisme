# ================================================================
# GitHub Actions - CI/CD Pipeline for VPS Deployment
# Déploiement automatique vers VPS avec Docker
# ================================================================

name: CI/CD Deploy to VPS

on:
  push:
    branches: [ "prod" ]
    paths-ignore:
      - '**/*.md'
      - '**/LICENSE'
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests and deploy directly'
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/frontend

permissions:
  contents: read
  packages: write

jobs:
  # ================================================================
  # CI - Tests Backend
  # ================================================================
  test-backend:
    name: 🧪 Test Backend
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_tests }}
    
    services:
      mysql:
        image: mysql:8.0
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: cameroun_tour_test
          MYSQL_USER: testuser
          MYSQL_PASSWORD: testpassword
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      mailhog:
        image: mailhog/mailhog
        ports:
          - 1025:1025

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: 🧪 Run Backend Tests
        working-directory: server
        env:
          DB_USER_MYSQL: testuser
          DB_PASSWORD_MYSQL: testpassword
        run: mvn -B test --file pom.xml

  # ================================================================
  # CI - Tests Frontend
  # ================================================================
  test-frontend:
    name: 🧪 Test Frontend
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_tests }}

    defaults:
      run:
        working-directory: ./client

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './client/package-lock.json'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧪 Run tests
        run: npm run test

  # ================================================================
  # Build - Docker Images
  # ================================================================
  build:
    name: 🔨 Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: |
      always() && 
      (needs.test-backend.result == 'success' || needs.test-backend.result == 'skipped') &&
      (needs.test-frontend.result == 'success' || needs.test-frontend.result == 'skipped')

    outputs:
      backend_tag: ${{ steps.meta-backend.outputs.tags }}
      frontend_tag: ${{ steps.meta-frontend.outputs.tags }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔐 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract metadata for Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: 🏷️ Extract metadata for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: 🔨 Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}

      - name: 🔨 Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY=${{ secrets.VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY }}

  # ================================================================
  # CD - Deploy to VPS
  # ================================================================
  deploy:
    name: 🚀 Deploy to VPS
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📋 Copy docker-compose to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          source: "docker-compose.prod.yml"
          target: ${{ secrets.VPS_DEPLOY_PATH }}

      - name: 🚀 Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          # Docker Images
          REGISTRY: ${{ env.REGISTRY }}
          BACKEND_IMAGE: ${{ env.BACKEND_IMAGE }}:latest
          FRONTEND_IMAGE: ${{ env.FRONTEND_IMAGE }}:latest
          # Vite Supabase
          VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          # Supabase Database
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          # Security
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          # Mail
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          # URLs
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          envs: REGISTRY,BACKEND_IMAGE,FRONTEND_IMAGE,SUPABASE_URL,SUPABASE_DB_USER,SUPABASE_DB_PASSWORD,JWT_SECRET_KEY,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,MAIL_HOST,MAIL_PORT,MAIL_USER,MAIL_PASSWORD,FRONTEND_URL,VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY,VITE_SUPABASE_URL,VITE_API_URL
          script: |
            cd ${{ secrets.VPS_DEPLOY_PATH }}
            
            # Login to GitHub Container Registry (token interpolé directement)
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Pull latest images
            docker pull $BACKEND_IMAGE
            docker pull $FRONTEND_IMAGE
            
            # Stop and remove old containers
            docker compose -f docker-compose.prod.yml down --remove-orphans || true
            
            # ============================================================
            # Export all secrets as environment variables for docker-compose
            # These variables exist ONLY during this script execution
            # They are NOT stored on the VPS
            # ============================================================
            export BACKEND_IMAGE=$BACKEND_IMAGE
            export FRONTEND_IMAGE=$FRONTEND_IMAGE
            export VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY=$VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY
            export VITE_SUPABASE_URL=$VITE_SUPABASE_URL
            export VITE_API_URL=$VITE_API_URL
            export SUPABASE_DB_PASSWORD=$SUPABASE_DB_PASSWORD
            export SUPABASE_DB_USER=$SUPABASE_DB_USER
            export SUPABASE_URL=$SUPABASE_URL
            export JWT_SECRET_KEY=$JWT_SECRET_KEY
            export GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID
            export GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET
            export MAIL_HOST=$MAIL_HOST
            export MAIL_PORT=$MAIL_PORT
            export MAIL_USER=$MAIL_USER
            export MAIL_PASSWORD=$MAIL_PASSWORD
            export FRONTEND_URL=$FRONTEND_URL
            
            # Start containers with exported environment variables
            docker compose -f docker-compose.prod.yml up -d
            
            # Cleanup old images
            docker image prune -f
            
            # Show status
            docker compose -f docker-compose.prod.yml ps

      - name: ✅ Deployment Summary
        run: |
          echo "## 🚀 Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Backend Image:** ${{ env.BACKEND_IMAGE }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "**Frontend Image:** ${{ env.FRONTEND_IMAGE }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed to:** ${{ secrets.VPS_HOST }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

