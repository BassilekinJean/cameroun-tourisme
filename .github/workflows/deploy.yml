# ================================================================
# GitHub Actions - CI/CD Pipeline for VPS Deployment
# Déploiement automatique vers VPS avec Docker
# ================================================================

name: CI/CD Deploy to VPS

on:
  push:
    branches: [ "prod" ]
    paths-ignore:
      - '**/*.md'
      - '**/LICENSE'
      - '.github/CODEOWNERS'
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests and deploy directly'
        required: false
        type: boolean
        default: false
      environment:
        description: 'Target environment'
        required: false
        type: choice
        options:
          - production
          - staging
        default: production

env:
  REGISTRY: ghcr.io
  # ghcr.io requires lowercase - using github.repository_owner to avoid uppercase issues
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}/backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}/frontend
  JAVA_VERSION: '21'
  NODE_VERSION: '20'

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false   # Ne jamais annuler un déploiement en cours

permissions:
  contents: read
  packages: write

# ================================================================
# CI - Tests Backend
# ================================================================
jobs:
  test-backend:
    name: 🧪 Test Backend
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.skip_tests != 'true' }}

    services:
      mysql:
        image: mysql:8.0
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: cameroun_tour_test
          MYSQL_USER: testuser
          MYSQL_PASSWORD: testpassword
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      mailhog:
        image: mailhog/mailhog
        ports:
          - 1025:1025

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: 🧪 Run Backend Tests
        working-directory: server
        env:
          DB_USER_MYSQL: testuser
          DB_PASSWORD_MYSQL: testpassword
        run: mvn -B test --file pom.xml

      - name: 📊 Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: server/target/surefire-reports/
          retention-days: 7

  # ================================================================
  # CI - Tests Frontend
  # ================================================================
  test-frontend:
    name: 🧪 Test Frontend
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.skip_tests != 'true' }}

    defaults:
      run:
        working-directory: ./client

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: './client/package-lock.json'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Lint
        run: npm run lint --if-present

      - name: 🧪 Run tests
        run: npm run test

      - name: 📊 Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-report
          path: client/coverage/
          retention-days: 7

  # ================================================================
  # Build - Docker Images
  # ================================================================
  build:
    name: 🔨 Build & Push Docker Images
    runs-on: ubuntu-latest
    environment: variable
    needs: [test-backend, test-frontend]
    if: |
      always() &&
      (needs.test-backend.result == 'success' || needs.test-backend.result == 'skipped') &&
      (needs.test-frontend.result == 'success' || needs.test-frontend.result == 'skipped')

    outputs:
      image_tag: ${{ steps.image-tag.outputs.tag }}
      backend_image: ${{ steps.image-tag.outputs.backend }}
      frontend_image: ${{ steps.image-tag.outputs.frontend }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # Tag immuable basé sur le SHA du commit (plus fiable que "latest")
      - name: 🏷️ Compute image tag
        id: image-tag
        run: |
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          BACKEND=$(echo "${{ env.BACKEND_IMAGE }}" | tr '[:upper:]' '[:lower:]')
          FRONTEND=$(echo "${{ env.FRONTEND_IMAGE }}" | tr '[:upper:]' '[:lower:]')
          echo "tag=${SHA_SHORT}" >> $GITHUB_OUTPUT
          echo "backend=${BACKEND}" >> $GITHUB_OUTPUT
          echo "frontend=${FRONTEND}" >> $GITHUB_OUTPUT

      - name: 🔐 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # BuildKit améliore les performances et le cache des layers
      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔨 Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            ${{ steps.image-tag.outputs.backend }}:${{ steps.image-tag.outputs.tag }}
            ${{ steps.image-tag.outputs.backend }}:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          # Cache cross-job grâce au registry
          cache-from: type=registry,ref=${{ steps.image-tag.outputs.backend }}:buildcache
          cache-to:   type=registry,ref=${{ steps.image-tag.outputs.backend }}:buildcache,mode=max

      - name: 🔨 Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: |
            ${{ steps.image-tag.outputs.frontend }}:${{ steps.image-tag.outputs.tag }}
            ${{ steps.image-tag.outputs.frontend }}:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY=${{ secrets.VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY }}
          cache-from: type=registry,ref=${{ steps.image-tag.outputs.frontend }}:buildcache
          cache-to:   type=registry,ref=${{ steps.image-tag.outputs.frontend }}:buildcache,mode=max

  # ================================================================
  # CD - Deploy to VPS
  # ================================================================
  deploy:
    name: 🚀 Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    environment: variable
    if: ${{ needs.build.result == 'success' }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📋 Copy docker-compose to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          source: "docker-compose.prod.yml"
          target: ${{ secrets.VPS_DEPLOY_PATH }}

      - name: 🚀 Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          BACKEND_IMAGE: ${{ needs.build.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ needs.build.outputs.frontend_image }}
          REGISTRY: ${{ env.REGISTRY }}
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Supabase
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          # Security
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          # Mail
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          # URLs
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          envs: IMAGE_TAG,BACKEND_IMAGE,FRONTEND_IMAGE,REGISTRY,GH_ACTOR,GH_TOKEN,SUPABASE_URL,JWT_SECRET_KEY,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,MAIL_HOST,MAIL_PORT,MAIL_USER,MAIL_PASSWORD,FRONTEND_URL,VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY,VITE_SUPABASE_URL,VITE_API_URL
          script: |
            set -euo pipefail
            cd "${{ secrets.VPS_DEPLOY_PATH }}"

            echo "▶ Tagging previous containers for rollback..."
            PREVIOUS_BACKEND=$(docker inspect --format='{{index .RepoTags 0}}' $(docker compose -f docker-compose.prod.yml ps -q backend 2>/dev/null) 2>/dev/null || echo "none")
            PREVIOUS_FRONTEND=$(docker inspect --format='{{index .RepoTags 0}}' $(docker compose -f docker-compose.prod.yml ps -q frontend 2>/dev/null) 2>/dev/null || echo "none")
            echo "Previous backend: $PREVIOUS_BACKEND"
            echo "Previous frontend: $PREVIOUS_FRONTEND"

            echo "▶ Logging in to GHCR..."
            echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin

            echo "▶ Pulling new images (tag: $IMAGE_TAG)..."
            docker pull "${BACKEND_IMAGE}:${IMAGE_TAG}"
            docker pull "${FRONTEND_IMAGE}:${IMAGE_TAG}"

            echo "▶ Exporting environment variables..."
            export BACKEND_IMAGE="${BACKEND_IMAGE}:${IMAGE_TAG}"
            export FRONTEND_IMAGE="${FRONTEND_IMAGE}:${IMAGE_TAG}"
            export SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY VITE_SUPABASE_URL VITE_API_URL
            export JWT_SECRET_KEY GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET
            export MAIL_HOST MAIL_PORT MAIL_USER MAIL_PASSWORD FRONTEND_URL

            echo "▶ Stopping old containers..."
            docker compose -f docker-compose.prod.yml down --remove-orphans || true

            echo "▶ Starting new containers..."
            docker compose -f docker-compose.prod.yml up -d

            echo "▶ Waiting for health checks (60s max)..."
            TIMEOUT=60
            ELAPSED=0
            until docker compose -f docker-compose.prod.yml ps | grep -q "healthy" || [ $ELAPSED -ge $TIMEOUT ]; do
              sleep 5
              ELAPSED=$((ELAPSED + 5))
              echo "  Waiting... ${ELAPSED}s / ${TIMEOUT}s"
            done

            if [ $ELAPSED -ge $TIMEOUT ]; then
              echo "❌ Health check timeout — rolling back..."
              docker compose -f docker-compose.prod.yml down --remove-orphans || true
              if [ "$PREVIOUS_BACKEND" != "none" ] && [ "$PREVIOUS_FRONTEND" != "none" ]; then
                export BACKEND_IMAGE="$PREVIOUS_BACKEND"
                export FRONTEND_IMAGE="$PREVIOUS_FRONTEND"
                docker compose -f docker-compose.prod.yml up -d
                echo "⚠️ Rolled back to previous images."
              fi
              docker logout ghcr.io
              rm -f ~/.docker/config.json
              exit 1
            fi

            echo "▶ Cleaning up old images..."
            docker image prune -f

            echo "▶ Container status:"
            docker compose -f docker-compose.prod.yml ps

            echo "▶ Securing credentials..."
            docker logout ghcr.io
            rm -f ~/.docker/config.json

            echo "✅ Deployment successful (tag: $IMAGE_TAG)"

      - name: ✅ Deployment Summary
        if: success()
        run: |
          echo "## 🚀 Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Image Tag** | \`${{ needs.build.outputs.image_tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Backend Image** | \`${{ needs.build.outputs.backend_image }}:${{ needs.build.outputs.image_tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Frontend Image** | \`${{ needs.build.outputs.frontend_image }}:${{ needs.build.outputs.image_tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **VPS Host** | \`${{ secrets.VPS_HOST }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | [\`${{ github.sha }}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Triggered by** | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Workflow** | [View run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |" >> $GITHUB_STEP_SUMMARY

      - name: ❌ Failure Summary
        if: failure()
        run: |
          echo "## ❌ Deployment Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The deployment of commit [\`${{ github.sha }}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) failed." >> $GITHUB_STEP_SUMMARY
          echo "A rollback to the previous version was attempted automatically." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[🔍 View logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY