services:
  # ================================================================
  # Service Backend - Spring Boot Docker
  # ================================================================
  - type: web
    name: cameroun-tourisme-backend
    env: docker
    rootDir: server
    dockerfilePath: Dockerfile
    dockerContext: .
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SUPABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        fromService:
          type: web
          name: cameroun-tourisme-frontend
          property: host

  # ================================================================
  # Service Frontend - React (Static Site)
  # ================================================================
  - type: web
    name: cameroun-tourisme-frontend
    env: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: client/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: cameroun-tourisme-backend
          property: host
